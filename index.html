<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Container Selector</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
        margin: 0;
        padding: 0;
    }

    .container {
        display: flex; 
        justify-content: space-between; 
        margin: 20px auto;
        max-width: 1200px;
        flex-wrap: wrap;
    }

    .fixed-tachos {
        width: 60%; 
        box-sizing: border-box; 
        margin-bottom: 20px;
    }

    .tacho-standard {
        width: 30%; 
        box-sizing: border-box; 
        border-radius: 10px; 
        overflow: hidden; 
        margin: 5px; 
        position: relative; 
    }

    .tacho-image-standard,
    .tacho-image {
        width: 100%; 
        height: auto;
        border-radius: 10px; 
    }

    .options {
        display: flex; 
        justify-content: center; 
        background-color: #d3d3d3; 
        padding: 10px 0; 
        overflow-x: auto; 
        flex-wrap: wrap; 
    }

    .texture-container {
        width: 80px; 
        margin: 10px; 
        text-align: center; 
        cursor: pointer; 
    }

    .texture-circle {
        width: 80px; 
        height: 80px; 
        border-radius: 50%;
        overflow: hidden; 
        margin: 0 auto; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
    }

    .texture-name {
        color: #3A3A3A; 
        font-weight: bold; 
        margin-top: 5px; 
    }

    .custom-tacho {
        width: 18%; 
        padding: 5px; 
        border-radius: 10px; 
    }

    .section-title {
        color: green; 
        font-weight: bold; 
    }

    @media (max-width: 768px) {
        .container {
            display: flex;
            justify-content: space-around;
            margin: 20px auto;
            max-width: 1200px;
            flex-wrap: wrap;
        }
        .fixed-tachos {
            width: 100%;
            margin-bottom: 20px; 
        }
        .custom-tacho {
            width: 50%;
            margin-bottom: 20px; 
            align-content: center;
        }

        .options {
            justify-content: space-around; 
        }

        .texture-container {
            width: 25%; 
        }
    }

    @media (max-width: 480px) {
        .texture-container {
            width: 40%;
        }
    }
</style>
</head>
<body>
<div class="container">
    <div class="fixed-tachos">
        <h2 class="section-title">Standard</h2>
        <div style="display: flex; justify-content: space-around;">
            <div class="tacho-standard">
                <img src="brushed-nickel-standard.png" alt="Tacho Standard 1" class="tacho-image-standard">
            </div>
            <div class="tacho-standard">
                <img src="standard-black.png" alt="Tacho Standard 2" class="tacho-image-standard">
            </div>
            <div class="tacho-standard">
                <img src="standard-brown.png" alt="Tacho Standard 3" class="tacho-image-standard">
            </div>
        </div>
    </div>


    <div class="custom-tacho">
        <h2 class="section-title">Custom</h2>
        <img src="./front-angle/custom.png" alt="Tacho Personalizado" id="customTacho" class="tacho-image">
    </div>
</div>

<h2 class="section-title">Premium</h2>
<div class="options">
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/evolution-ebony.png')">
        <div class="texture-circle">
            <img src="./tramas/ebony.png" alt="Ebony" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Ebony</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/evolution-dark-roast.png')">
        <div class="texture-circle">
            <img src="./tramas/evolution-dark-roast.png" alt="Dark Roast" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Dark Roast</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/evolution-ivory.png')">
        <div class="texture-circle">
            <img src="./tramas/ivory.png" alt="Ivory" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Ivory</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/retro-grey.png')">
        <div class="texture-circle">
            <img src="./tramas/retro-grey.png" alt="Retro Grey Stucco" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Retro Grey Stucco</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/vintage-brick.png')">
        <div class="texture-circle">
            <img src="./tramas/vintage-brick.png" alt="Vintage Brick" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Vintage Brick</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/old-school-mix.png')">
        <div class="texture-circle">
            <img src="./tramas/old-school-mix-1.png" alt="Old School Mix" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Old School Mix</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/urban-loft.png')">
        <div class="texture-circle">
            <img src="./tramas/urban-loft.png" alt="Urban Loft" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Urban Loft</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/stacked-ledge-rock.png')">
        <div class="texture-circle">
            <img src="./tramas/stack-ladge-rock.png" alt="Stack Ledge Rock" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Stack Ledge Rock</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/walnut-plank.png')">
        <div class="texture-circle">
            <img src="./tramas/walnut-plank.png" alt="Walnut Plank" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Walnut Plank</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/white-washed-plank.png')">
        <div class="texture-circle">
            <img src="./tramas/white-washed-plank.png" alt="White Washed Plank" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">White Washed Plank</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/mocha-slate.png')">
        <div class="texture-circle">
            <img src="./tramas/mocha-slate.png" alt="Mocha Slate" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">Mocha Slate</div>
    </div>
    <div class="texture-container" onclick="updateCustomTacho('./front-angle/white-harringbone.png')">
        <div class="texture-circle">
            <img src="./tramas/white-harringbone.png" alt="White Harringbone" style="width: 100%; height: auto;">
        </div>
        <div class="texture-name">White Harringbone</div>
    </div>
</div>

<script>
    function updateCustomTacho(imagePath) {
        const customTacho = document.getElementById('customTacho');
        customTacho.src = imagePath;
    }
</script>
</body>
</html>
